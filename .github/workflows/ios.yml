name: Build iPhone app
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: iphone-build
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'toofpaste/tab-lockdown-ios'
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check navigation policy
        run: |
          swiftc App/NavigationPolicy.swift Tests/main.swift -o /tmp/policy-checks
          /tmp/policy-checks
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build iPhone application
        run: |
          xcodebuild -project TabLockdown.xcodeproj -scheme TabLockdown -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/TabLockdown.app Payload/
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload TabLockdown-unsigned.ipa
      - name: Build simulator application
        run: |
          xcodebuild -project TabLockdown.xcodeproj -scheme TabLockdown -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Launch in iPhone simulator
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for group in d["devices"].values() for x in group if x["name"].startswith("iPhone")))')
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" build/Build/Products/Debug-iphonesimulator/TabLockdown.app
          xcrun simctl launch "$DEVICE" com.toofpaste.tablockdown
          sleep 4
          xcrun simctl io "$DEVICE" screenshot simulator.png
      - name: Publish sideload package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shasum -a 256 TabLockdown-unsigned.ipa > SHA256SUMS.txt
          gh release create "build-${{ github.run_number }}" TabLockdown-unsigned.ipa SHA256SUMS.txt simulator.png --title "Tab Lockdown build ${{ github.run_number }}" --notes-file RELEASE-NOTES.md
